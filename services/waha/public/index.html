<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Celular do lead · simulador do WAHA</title>
  <style>
    :root { --ink: #1c2530; --muted: #5c6877; --line: #d9dee5; --bg: #f5f6f8; --card: #fff; --accent: #0f6b5c; --out: #d9f2e6; --in: #fff; --err: #a8231f; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100dvh; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
    .wrap { max-width: 460px; height: 100%; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; overflow-y: auto; }
    .wrap > :not(.phone) { flex-shrink: 0; }
    h1 { margin: 0; font-size: 20px; }
    .sub { margin: 5px 0 12px; font-size: 14px; color: var(--muted); }
    .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #e7ecf1; color: var(--muted); vertical-align: middle; }
    label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 10px 0 4px; }
    select, textarea { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); }
    textarea { resize: vertical; min-height: 56px; height: 56px; }
    select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 3px solid #7cc4b6; outline-offset: 2px; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    button { font: inherit; font-weight: 600; padding: 8px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
    button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    button:hover { filter: brightness(1.1); }
    button:disabled { opacity: .5; cursor: wait; }
    .actions { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
    .phone { margin: 10px 0; background: #e8e2d9; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; flex: 1; min-height: 120px; }
    .phone-head { flex-shrink: 0; background: var(--accent); color: #fff; padding: 10px 14px; font-weight: 600; }
    .phone-head small { display: block; font-weight: 400; opacity: .85; }
    #chat { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
    .bubble { max-width: 82%; padding: 6px 10px; border-radius: 10px; background: var(--in); box-shadow: 0 1px 1px rgba(0,0,0,.08); white-space: pre-wrap; overflow-wrap: anywhere; align-self: flex-start; }
    .bubble.out { background: var(--out); align-self: flex-end; }
    .bubble.failed { outline: 2px solid var(--err); }
    .meta { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
    .empty { margin: auto; color: var(--muted); text-align: center; }
    #status { min-height: 1.5em; margin: 6px 0 0; color: var(--muted); }
    #status.error { color: var(--err); font-weight: 600; }
    #banner { padding: 7px 10px; background: #e7ecf1; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; margin-bottom: 10px; }
    #banner a { display: block; margin-top: 2px; color: var(--ink); text-underline-offset: 4px; }
    #banner a:focus-visible, summary:focus-visible { outline: 3px solid #7cc4b6; outline-offset: 2px; }
    .catalog { margin-top: 10px; padding: 8px 0; border-block: 1px solid var(--line); }
    .catalog summary { font-size: 13px; font-weight: 600; cursor: pointer; }
    .catalog ul { list-style: none; margin: 7px 0 0; padding: 0; font-size: 13px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
    .catalog small { display: block; font-size: 13px; color: var(--muted); }
    .suggestions h2 { margin: 0; font-size: 13px; }
    .suggestions { margin-bottom: 8px; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .chips button { display: flex; flex-direction: column; align-items: flex-start; gap: 0; min-height: 28px; padding: 4px 8px; font-size: 12px; font-weight: 400; text-align: left; background: var(--card); color: var(--ink); border: 1px solid var(--line); }
    .chips button:hover { filter: none; background: #eef1f4; }
    .chip-purpose { color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="banner" hidden><span id="banner-text" role="status" aria-live="polite"></span><a id="back" href="#">Voltar ao guia</a></div>
    <h1>Celular do lead <span class="badge">simulador do WAHA · porta 3200</span></h1>
    <p class="sub">Escolha quem você é e o número da Clinic. Escreva e envie a mensagem como o lead.</p>

    <div class="row">
      <div><label for="persona">Quem é você</label><select id="persona"></select></div>
      <div><label for="session">Número da Clinic</label><select id="session"></select></div>
    </div>

    <details class="catalog" id="catalog" hidden><summary>Turmas abertas (lidas do ERP)</summary><ul id="catalog-list"></ul></details>

    <div class="phone">
      <div class="phone-head"><span id="who"></span><small id="number"></small></div>
      <div id="chat" aria-live="polite"></div>
    </div>

    <form id="form">
      <section class="suggestions" aria-labelledby="suggestions-title">
        <h2 id="suggestions-title">Sugestões de mensagem</h2>
        <div class="chips" id="chips"></div>
      </section>
      <label for="text">Mensagem</label>
      <textarea id="text" maxlength="4096" placeholder="Escreva como o lead escreveria"></textarea>
      <div class="actions">
        <button type="submit" id="send">Enviar</button>
        <button type="button" class="ghost" id="qr">Ler QR do banner do Rio</button>
      </div>
    </form>
    <p id="status" role="status" aria-live="polite">Escolha uma sugestão ou escreva sua mensagem.</p>
  </div>

  <script>
    // The fictitious people come from the simulator (GET /api/personas).
    let PERSONAS = [];
    const LABEL = { sp: 'São Paulo', rj: 'Rio de Janeiro', cps: 'Campinas' };
    const $ = (id) => document.getElementById(id);
    const personaEl = $('persona'), sessionEl = $('session'), chatEl = $('chat'), textEl = $('text'), statusEl = $('status');
    let last = '';

    const setStatus = (msg, isError) => { statusEl.textContent = msg; statusEl.className = isError ? 'error' : ''; };
    const persona = () => PERSONAS[personaEl.selectedIndex];
    const hhmm = (iso) => new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

    function renderHead() {
      $('who').textContent = persona().name;
      $('number').textContent = '+' + persona().number;
    }

    function render(messages) {
      chatEl.replaceChildren();
      if (messages.length === 0) {
        const p = document.createElement('p');
        p.className = 'empty';
        p.textContent = 'Nenhuma mensagem ainda.';
        chatEl.append(p);
        return;
      }
      for (const m of messages) {
        const b = document.createElement('div');
        b.className = 'bubble ' + m.direction + (m.failed ? ' failed' : '');
        b.append(document.createTextNode(m.text));
        const meta = document.createElement('span');
        meta.className = 'meta';
        meta.textContent = hhmm(m.at) + ' · Clinic ' + (LABEL[m.session] ?? m.session) + (m.failed ? ' · o core não aceitou' : '');
        b.append(meta);
        chatEl.append(b);
      }
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    async function refresh(force) {
      try {
        const res = await fetch('/api/phones/' + persona().number);
        const body = await res.json();
        if (!res.ok) return setStatus(body.error || ('Erro ' + res.status), true);
        const snapshot = JSON.stringify(body);
        if (force || snapshot !== last) { render(body); last = snapshot; }
      } catch (e) {
        setStatus('Sem conexão com o simulador: ' + e.message, true);
      }
    }

    // Suggestions fill the message box; the second line says what each one tests.
    const SUGGESTIONS = [
      ['Quero saber da turma de Harmonização Facial em São Paulo', 'Cita curso e unidade'],
      ['Vi no Instagram', 'Genérica: a IA lista as turmas'],
      ['Estou com inchaço depois do procedimento', 'Vai para a equipe clínica'],
    ];
    function renderChips() {
      for (const [text, purpose] of SUGGESTIONS) {
        const b = document.createElement('button');
        b.type = 'button';
        const first = document.createElement('span');
        first.textContent = text;
        const second = document.createElement('span');
        second.className = 'chip-purpose';
        second.textContent = purpose;
        b.append(first, second);
        b.addEventListener('click', () => { textEl.value = text; textEl.focus(); setStatus('Sugestão preenchida. Revise e envie.'); });
        $('chips').append(b);
      }
    }

    // Banner and class list come from the core and the ERP through this same server; when they fail, the page stays as it was.
    const FULL = { sp: 'São Paulo', rj: 'Rio de Janeiro', cps: 'Campinas', online: 'Online' };
    const NEXT_ACTION = ['rode o script em Bastidores', 'escreva citando o curso e a unidade', 'continue no Atendimento', 'confirme o pagamento no ERP', 'confira a oportunidade em Ganha no CRM'];
    $('back').href = location.protocol + '//' + location.hostname + ':3000';
    async function getJson(path) {
      try {
        const res = await fetch(path);
        return res.ok ? await res.json() : null;
      } catch (e) {
        return null;
      }
    }
    async function refreshGuide() {
      const guide = await getJson('/api/guide');
      const current = guide && Array.isArray(guide.steps) ? guide.steps.findIndex((s) => s.status === 'current') : -1;
      $('banner').hidden = !guide || !Array.isArray(guide.steps);
      if (guide && Array.isArray(guide.steps)) {
        $('banner-text').textContent = current < 0 ? 'Demo concluída: ' + guide.total + ' de ' + guide.total + ' passos feitos' : 'Passo ' + (current + 1) + ' de ' + guide.total + ': ' + NEXT_ACTION[current];
      }
    }
    let lastCatalog = '';
    async function refreshCatalog() {
      const items = await getJson('/api/catalog');
      const list = Array.isArray(items) ? items : [];
      $('catalog').hidden = list.length === 0;
      const snapshot = JSON.stringify(list);
      if (snapshot === lastCatalog) return;
      lastCatalog = snapshot;
      $('catalog-list').replaceChildren(...list.map((c) => {
        const li = document.createElement('li');
        const small = document.createElement('small');
        const date = String(c.nextClass).slice(8, 10) + '/' + String(c.nextClass).slice(5, 7);
        small.textContent = c.unit === 'online' ? date : (FULL[c.unit] ?? c.unit) + ' · ' + date + ' · ' + c.seatsLeft + (c.seatsLeft === 1 ? ' vaga' : ' vagas');
        li.append(document.createTextNode(c.name), small);
        return li;
      }));
    }
    const refreshSide = () => Promise.all([refreshGuide(), refreshCatalog()]);

    async function send(event) {
      event.preventDefault();
      const text = textEl.value.trim();
      if (!text) return setStatus('Escreva uma mensagem.', true);
      $('send').disabled = true;
      try {
        const res = await fetch('/api/phones/' + persona().number + '/send', {
          method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ session: sessionEl.value, text }),
        });
        const body = await res.json().catch(() => ({}));
        if (res.ok) { textEl.value = ''; setStatus('Mensagem entregue ao core.'); }
        else setStatus(body.error || ('Erro ' + res.status), true);
      } catch (e) {
        setStatus('Sem conexão com o simulador: ' + e.message, true);
      }
      $('send').disabled = false;
      await refresh(true);
    }

    async function readQr() {
      $('qr').disabled = true;
      try {
        const res = await fetch('/api/qr/K7P2');
        const body = await res.json().catch(() => ({}));
        if (!res.ok) { setStatus(body.error || ('Erro ' + res.status), true); }
        else {
          textEl.value = body.text || 'Olá! Vi o cartaz na recepção e quero saber dos cursos (cód. K7P2)';
          if (body.session) sessionEl.value = body.session;
          setStatus('QR lido: o core registrou a leitura e a mensagem pronta está no campo. Agora é só enviar.');
        }
      } catch (e) {
        setStatus('Sem conexão com o simulador: ' + e.message, true);
      }
      $('qr').disabled = false;
    }

    async function init() {
      try {
        PERSONAS = await (await fetch('/api/personas')).json();
      } catch (e) {
        setStatus('Não consegui listar as pessoas: ' + e.message, true);
      }
      for (const p of PERSONAS) personaEl.append(new Option(p.name, p.number));
      try {
        const sessions = await (await fetch('/api/sessions')).json();
        for (const s of sessions) sessionEl.append(new Option('Clinic ' + (LABEL[s.name] ?? s.name) + ' (+' + s.me.id.replace('@c.us', '') + ')', s.name));
      } catch (e) {
        setStatus('Não consegui listar as sessões: ' + e.message, true);
      }
      sessionEl.value = persona().session;
      renderHead();
      personaEl.addEventListener('change', () => { sessionEl.value = persona().session; renderHead(); refresh(true); });
      $('form').addEventListener('submit', send);
      $('qr').addEventListener('click', readQr);
      renderChips();
      refresh(true);
      refreshSide();
      setInterval(refresh, 2000);
      setInterval(refreshSide, 2000);
    }
    init();
  </script>
</body>
</html>
