# Three services from one image, like three machines: core (3000), erp (3100) and waha (3200).
# Secrets come from the environment or .env, with demonstration defaults (see .env.example).
# Each service gets only what it uses: Meta credentials and the hash key stay in the core.
# Inside the container the service listens on every interface (HOST=0.0.0.0); the ports are published only on 127.0.0.1.
x-service: &service
  build: .
  image: clinic-cursos-demo

x-shared-env: &shared-env
  HOST: 0.0.0.0
  CORE_PORT: "3000"
  CORE_URL: http://core:3000
  ERP_PORT: "3100"
  ERP_URL: http://erp:3100
  ERP_TOKEN: ${ERP_TOKEN:-demo-erp-token}
  WAHA_PORT: "3200"
  WAHA_URL: http://waha:3200
  WAHA_API_KEY: ${WAHA_API_KEY:-demo-waha-key}
  WAHA_WEBHOOK_HMAC_KEY: ${WAHA_WEBHOOK_HMAC_KEY:-demo-waha-hmac}
  WAHA_SESSIONS: ${WAHA_SESSIONS:-sp:551130000001,rj:552130000002,cps:551930000003}

services:
  core:
    <<: *service
    command: ["node", "src/main.ts"]
    environment:
      <<: *shared-env
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-waha}
      META_APP_SECRET: ${META_APP_SECRET:-demo-meta-secret}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID:-}
      PII_HASH_KEY: ${PII_HASH_KEY:-demo-pii-hash-key}
    ports:
      - "127.0.0.1:3000:3000"
  erp:
    <<: *service
    command: ["node", "services/erp/main.ts"]
    environment: *shared-env
    ports:
      - "127.0.0.1:3100:3100"
  waha:
    <<: *service
    command: ["node", "services/waha/main.ts"]
    environment: *shared-env
    ports:
      - "127.0.0.1:3200:3200"
